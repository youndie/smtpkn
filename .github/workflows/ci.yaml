name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The closing run of a milestone: on Linux the linuxX64Test task is enabled and the tests really
  # do run. They cannot run on macOS, which is why the local loop uses macosArm64 — see research D9.
  linux:
    name: linuxX64 + jvm + ktlint + E2E
    runs-on: ubuntu-latest

    env:
      SMTP_E2E_HOST: 127.0.0.1
      SMTP_E2E_REQUIRED: "1"
      SMTP_TLS_E2E_HOST: 127.0.0.1
      SMTP_TLS_E2E_PORT: "1465"
      # Mailpit answers over HTTP, so the E2E can check what was stored and not just the reply.
      SMTP_E2E_API_PORT: "8025"

    steps:
      - uses: actions/checkout@v5

      - uses: youndie/sborka/.github/actions/setup-kotlin@main

      # docker-compose is the single source of truth for the test servers. A service container
      # would have to duplicate it here, and could not mount certificates generated by this job.
      - name: start the test servers
        run: |
          sh tools/generate-test-certs.sh
          docker compose up -d --wait
          echo "SMTP_TLS_E2E_CA=$PWD/build/e2e-certs/ca.pem" >> "$GITHUB_ENV"

      - name: build
        run: ./gradlew build --stacktrace

      # The same E2E against a real Postfix. Mailpit accepts almost anything, so it cannot fail
      # a client that breaks the rules; Postfix can, and already did — it refuses example.com
      # outright because the domain publishes a null MX.
      - name: E2E against Postfix
        env:
          SMTP_E2E_PORT: "1587"
          SMTP_E2E_RECIPIENT: rcpt@postfix.test
          # Postfix has no API to ask, so the content check is skipped for this run.
          SMTP_E2E_API_PORT: ""
        run: ./gradlew :smtp-transport-ktor:jvmTest --rerun-tasks --stacktrace

      - name: server logs
        if: failure()
        run: docker compose logs --tail 50

      - name: test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-linux
          path: '**/build/reports/tests/**'

  # The development host target: if it breaks, everyone's local TDD loop stops.
  macos:
    name: macosArm64
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: youndie/sborka/.github/actions/setup-kotlin@main

      - name: test
        run: ./gradlew macosArm64Test --stacktrace
