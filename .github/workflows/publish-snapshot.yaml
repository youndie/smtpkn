name: Publish snapshot

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish
        required: true
        default: 0.1.0-SNAPSHOT

concurrency:
  group: publish-snapshot
  cancel-in-progress: false

env:
  VERSION: ${{ inputs.version || '0.1.0-SNAPSHOT' }}

jobs:
  # macOS builds everything except the Linux side of the cinterop module: Kotlin/Native
  # cross-compiles klibs for linuxX64, linuxArm64 and mingwX64 from here, and the Apple targets
  # need this host anyway.
  macos:
    name: pure modules and macOS TLS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: youndie/sborka/.github/actions/setup-kotlin@main

      - name: publish
        env:
          REPOSILITE_USER: ${{ secrets.REPOSILITE_USER }}
          REPOSILITE_SECRET: ${{ secrets.REPOSILITE_SECRET }}
        run: |
          ./gradlew -Pversion="$VERSION" --stacktrace \
            :smtp-core:publishAllPublicationsToWipSnapshotsRepository \
            :smtp-client:publishAllPublicationsToWipSnapshotsRepository \
            :smtp-sasl:publishAllPublicationsToWipSnapshotsRepository \
            :smtp-mime:publishAllPublicationsToWipSnapshotsRepository \
            :smtp-testing:publishAllPublicationsToWipSnapshotsRepository \
            :smtp-transport-ktor:publishAllPublicationsToWipSnapshotsRepository \
            :smtp-tls-jvm:publishAllPublicationsToWipSnapshotsRepository \
            :smtp-tls-openssl:publishAllPublicationsToWipSnapshotsRepository

  # Only the native TLS module, and only its Linux artefacts: cinterop needs the headers of the
  # target platform, so this half cannot be built anywhere else (see RELEASING.md).
  linux:
    name: Linux TLS
    runs-on: ubuntu-latest
    needs: macos
    steps:
      - uses: actions/checkout@v5

      - uses: youndie/sborka/.github/actions/setup-kotlin@main

      - name: publish
        env:
          REPOSILITE_USER: ${{ secrets.REPOSILITE_USER }}
          REPOSILITE_SECRET: ${{ secrets.REPOSILITE_SECRET }}
        run: |
          ./gradlew -Pversion="$VERSION" --stacktrace \
            :smtp-tls-openssl:publishAllPublicationsToWipSnapshotsRepository
