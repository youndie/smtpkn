org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.parallel=true

kotlin.code.style=official

# A default that is a snapshot on purpose: a build with no -PVERSION must not be able to produce
# something that looks like a release.
version=0.1.0-SNAPSHOT

# WHAT THIS REPOSITORY TELLS THE SHARED CONVENTIONS.
sborka.group=io.github.youndie
sborka.repository=youndie/kmp-smtp-client
sborka.description=SMTP client for Kotlin Multiplatform: RFC 5321 over sockets, with STARTTLS, SASL and the ESMTP extensions, built to run on Kotlin/Native.
sborka.inceptionYear=2026

# TWO DIFFERENT NUMBERS, AND THE DIFFERENCE IS THE POINT. The toolchain is the JDK this library is
# BUILT with; the floor is the oldest Java a consumer may be ON. `sborka.kmp` and `sborka.jvm`
# compile the jvm side to the floor and the Java tasks to the same release — the two have to agree
# or the build refuses to run, which is why they used to be written out together in smtp.jvm.
sborka.jvmToolchain=21
sborka.jvmFloor=17

# PREFER_SETTINGS rather than the default refusal, and not by preference: `smtp-core`, `smtp-sasl`
# and `smtp-mime` have js and wasmJs targets, and the Kotlin plugin declares an ivy repository for
# the Node distribution ON THE PROJECT. FAIL_ON_PROJECT_REPOS then refuses the build over a
# repository nobody here wrote — "added by unknown code" — and declaring the same one in settings
# does not satisfy it. Settings repositories still win; the mode simply stops shouting.
sborka.repositoriesMode=PREFER_SETTINGS

# linuxX64 tests cannot run on macOS, and KGP disables the `linuxX64Test` task on a non-Linux host
# by itself — there is no point in being warned about it on every configuration. The closing run of
# a milestone happens on Linux, where the task is enabled.
# See docs/research/research-architecture.md, D9.
kotlin.native.ignoreDisabledTargets=true
