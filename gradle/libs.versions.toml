[versions]
# The shared build conventions. One number for both the plugins this build applies and the artefact
# `build-logic` compiles against.
sborka = "0.1.0.13"
kotlin = "2.4.10"
kotlinxCoroutines = "1.11.0"
ktor = "3.5.2"
kotlincrypto = "0.8.0"
kotlincryptoRandom = "0.6.0"
kotlinxDatetime = "0.8.0"
# Maven Central moved to the Central Portal, whose upload is a bundle POST rather than a deploy.
# Hand-rolling that is a lot of code for one task; this plugin is the de-facto standard for KMP.
mavenPublish = "0.37.0"
# Pinned on purpose: ktlint is wired in as a CLI, without a wrapper plugin.
# See docs/research/research-architecture.md, D10.

[libraries]
sborka-conventions = { module = "ru.workinprogress.sborka:conventions", version.ref = "sborka" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }
# Only :smtp-mime needs it, and only to write an RFC 5322 date.
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinxDatetime" }

# TCP transport. Lives in :smtp-transport-ktor only (M3).
# ktor-network-tls is never added: on Kotlin/Native it is a stub, see research 1.1.
ktor-network = { module = "io.ktor:ktor-network", version.ref = "ktor" }
# Test-only: asking Mailpit over HTTP what it stored. The CIO engine covers every target
# this project declares, which is why it can live in a common test source set.
ktor-client-cio = { module = "io.ktor:ktor-client-cio", version.ref = "ktor" }

# Crypto for SASL (M5), pure Kotlin with no cinterop.
kotlincrypto-hmac-sha2 = { module = "org.kotlincrypto.macs:hmac-sha2", version.ref = "kotlincrypto" }
kotlincrypto-hmac-sha1 = { module = "org.kotlincrypto.macs:hmac-sha1", version.ref = "kotlincrypto" }
kotlincrypto-hmac-md = { module = "org.kotlincrypto.macs:hmac-md", version.ref = "kotlincrypto" }
kotlincrypto-hash-sha1 = { module = "org.kotlincrypto.hash:sha1", version.ref = "kotlincrypto" }
kotlincrypto-hash-sha2 = { module = "org.kotlincrypto.hash:sha2", version.ref = "kotlincrypto" }
# Nonces must be unpredictable, and kotlin.random.Random is not.
kotlincrypto-random = { module = "org.kotlincrypto.random:crypto-rand", version.ref = "kotlincryptoRandom" }


kotlin-gradlePlugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
mavenPublish-gradlePlugin = { module = "com.vanniktech:gradle-maven-publish-plugin", version.ref = "mavenPublish" }

[plugins]
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
