name: kmp-smtp-client

# SMTP-серверы для интеграционных и E2E-тестов.
#
# Mailpit выбран не как «настоящий» MTA, а как сервер, на котором можно что-то утверждать:
# он говорит по SMTP по-настоящему (EHLO с расширениями, PIPELINING, AUTH, STARTTLS), но
# при этом отдаёт принятые письма по HTTP — а значит, тест может проверить, что до сервера
# доехало ровно то, что отправляли.
#
# Плата за это — терпимость: Mailpit принимает почти всё, поэтому нарушения строгости
# протокола он не поймает. Проверка против настоящего Postfix заведена как M-37.
#
# Сертификаты берутся из ./build/e2e-certs; создать их — `tools/generate-test-certs.sh`.
# В репозитории их нет намеренно: сертификат в git протухает и потом роняет тесты по причине,
# не имеющей отношения к коду.
services:
  # Открытый канал плюс STARTTLS на том же порту — сценарий сабмишна на 587.
  mailpit:
    image: axllent/mailpit:v1.31.0
    container_name: kmp-smtp-mailpit
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # HTTP: веб-интерфейс и API, по которому тест читает принятые письма
    volumes:
      - ./build/e2e-certs:/certs:ro
    environment:
      # Любые учётные данные принимаются: до M5 механизмы SASL не реализованы, а отвергать
      # AUTH сервер не должен — иначе тесты M5 придётся заводить отдельным сервисом.
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
      MP_SMTP_TLS_CERT: /certs/server.pem
      MP_SMTP_TLS_KEY: /certs/server-key.pem
      MP_MAX_MESSAGES: "0"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      timeout: 2s
      retries: 30

  # Настоящий Postfix. Mailpit удобен тем, что отдаёт принятые письма по HTTP, но принимает почти
  # всё; строгость проверяется здесь. Письма никуда не уходят: исходящей доставки нет, всё оседает
  # в очереди — для теста важен ответ сервера, а не судьба письма.
  postfix:
    image: boky/postfix:v5.1.0-debian
    container_name: kmp-smtp-postfix
    ports:
      - "1587:587"
    environment:
      ALLOWED_SENDER_DOMAINS: example.com
      RELAYHOST: ""
      POSTFIX_myhostname: postfix.test
      # Без этого Postfix требует разрешать релей по сети, а тесты ходят с адреса контейнера.
      POSTFIX_mynetworks: 0.0.0.0/0
      # Получатель должен быть локальным. Иначе Postfix отвергает example.com с 556 nullMX
      # (домен явно объявил, что почту не принимает), а Mailpit такое берёт молча.
      # Ради этой разницы Postfix здесь и стоит.
      POSTFIX_mydestination: "postfix.test, localhost"
      # Без этого Postfix ищет получателя в /etc/aliases.lmdb, которого в образе нет, и
      # отвечает 451 «Temporary lookup failure». static:all значит «любой локальный
      # получатель существует»: доставка нас не интересует, интересует ответ на RCPT.
      # Пустое значение сюда передать нельзя — образ пропускает пустые переменные.
      POSTFIX_local_recipient_maps: "static:all"
    healthcheck:
      test: ["CMD", "sh", "-c", "postfix status || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 30

  # Implicit TLS — сценарий сабмишна на 465 (`docs/rfc/rfc8314.txt`).
  mailpit-tls:
    image: axllent/mailpit:v1.31.0
    container_name: kmp-smtp-mailpit-tls
    ports:
      - "1465:1025"
      - "8465:8025"
    volumes:
      - ./build/e2e-certs:/certs:ro
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_TLS_CERT: /certs/server.pem
      MP_SMTP_TLS_KEY: /certs/server-key.pem
      MP_SMTP_REQUIRE_TLS: "true"
      MP_MAX_MESSAGES: "0"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      timeout: 2s
      retries: 30
